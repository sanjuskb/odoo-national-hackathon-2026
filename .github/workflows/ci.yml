name: Integration quality gate

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: Repository integrity and secret-file guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-repository.mjs
      - run: node scripts/check-secrets.cjs

  module-checks:
    name: ${{ matrix.module }} install / lint / build / test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check module when implemented
        shell: bash
        env:
          CI: 'true'
        run: |
          module="${{ matrix.module }}"
          if [ ! -f "$module/package.json" ]; then
            echo "::notice::$module has not been scaffolded yet; module checks skipped"
            exit 0
          fi
          if [ ! -f "$module/package-lock.json" ]; then
            echo "::error::$module/package.json exists without a lockfile; run npm install and commit package-lock.json"
            exit 1
          fi
          cd "$module"
          npm ci --no-audit --no-fund
          npm run --if-present lint
          npm run --if-present build
          npm run test

  billing-tests:
    name: Deterministic billing unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require and run billing tests when module exists
        run: |
          if [ -f billing/package.json ]; then
            cd billing && npm test
          else
            echo "::notice::Sanju billing module not yet integrated; billing tests not run"
          fi

  pr-branch-flow:
    name: Branch workflow gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Forbid feature branches merging directly to main
        env:
          SOURCE: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          if [[ "$BASE" == "main" && "$SOURCE" != "develop" ]]; then
            if [[ "$SOURCE" == "chore/main-release-gate-bootstrap" && "$PR_NUMBER" == "23" ]]; then
              echo "::notice::One-time CI bootstrap PR #23; no feature code released."
            else
              echo "::error::Release PRs must originate from develop; feature work goes to develop first."
              exit 1
            fi
          fi
          echo "Branch workflow is valid."
